<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIPO GI - GitHub Fixed</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"><div style="padding:40px;text-align:center">Loading NIPO GI...<div id="status"></div></div></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAR3MJ9cX_c3MFChtd5jwgfM3NysRwzbk0",
  authDomain: "gi-nipo.firebaseapp.com",
  projectId: "gi-nipo",
  storageBucket: "gi-nipo.firebasestorage.app",
  messagingSenderId: "219686560103",
  appId: "1:219686560103:web:f0beff056ab860eedb4fc2"
};
firebase.initializeApp(firebaseConfig);
window.db = firebase.firestore();
console.log("Firebase OK gi-nipo");
var Tm=[{id:"1",giNo:"LK/GI/01",appDate:"27/02/2025",applicant:"Sri Lanka Export Development Board",address:"No. 42, NDB-EDB Tower, Nawam Mawatha, Colombo 02",giName:"Ceylon Cinnamon",type:"Agricultural",conditions:"-",gazette:"09/02/2026, L033",registration:"Pending",page:"1",fileNo:"GI"},{id:"2",giNo:"LK/GI/02",appDate:"11/04/2025",applicant:"Trade Development Authority of Pakistan (TDAP)",address:"5th floor, Block A, Finance and Trade Centre, Shahrah-e-Faisal, Karachi-75350",giName:"Basmati",type:"Agricultural",conditions:"-",gazette:"02/10/2026, Gazette No. 2,509",registration:"Pending",page:"1",fileNo:"GI"},{id:"3",giNo:"LK/GI/03",appDate:"09/03/2026",applicant:"Ceylon Golden Pineapple Association",address:"No. 190, Lavalupitiya, Wathuragama, Gampaha",giName:"Ceylon Golden Pineapple",type:"Agricultural",conditions:"-",gazette:"-",registration:"Pending",page:"2",fileNo:"GI"}];

window.Tm = Tm;
window.pushRegistryToFirebase = async () => {
  if(!window.db) { alert("Firebase not ready"); return; }
  let count=0;
  for(const item of Tm){
    try {
      await window.db.collection("gi_registry").doc(item.id).set(item, {merge:true});
      count++;
    } catch(e) { console.error(e); alert("Error: "+e.message+" - Check Firestore Rules"); return; }
  }
  alert("Pushed "+count+" to Firebase - Public view ready");
};

async function render() {
  const root = document.getElementById('root');
  let data = Tm;
  let fbMsg = "Local data";
  if(window.db) {
    try {
      const snap = await window.db.collection("gi_registry").get();
      if(!snap.empty) {
        data = [];
        snap.forEach(doc=> data.push(doc.data()));
        fbMsg = "From Firebase: "+data.length+" records";
      } else {
        fbMsg = "Firebase empty - showing local "+data.length+" - run pushRegistryToFirebase() in console (F12)";
      }
    } catch(e) {
      fbMsg = "Firebase error (check Rules): "+e.message;
    }
  }
  root.innerHTML = `
    <div style="max-width:1280px;margin:auto;padding:20px">
      <h1 style="font-size:36px;font-weight:bold">NIPO GI</h1>
      <p style="font-size:11px;color:gray">Public View - ${fbMsg}</p>
      <button onclick="pushRegistryToFirebase()" style="margin-top:10px;padding:8px 16px;background:black;color:white;border-radius:8px">Push to Firebase (Admin)</button>
      <div style="margin-top:20px;background:white;border:1px solid #ddd;border-radius:12px;overflow:hidden">
        <table style="width:100%;font-size:13px"><thead style="background:#f8f8f8"><tr><th style="padding:12px;text-align:left">GI No</th><th style="padding:12px;text-align:left">GI Name</th><th style="padding:12px;text-align:left">Applicant</th><th style="padding:12px;text-align:left">Status</th></tr></thead><tbody id="tbody"></tbody></table>
      </div>
      <div style="margin-top:20px;padding:16px;background:white;border:1px solid #ddd;border-radius:12px;font-size:12px;color:gray">
        <b>GitHub Pages Fix:</b><br>
        1. Rename this file to index.html<br>
        2. Upload to GitHub repo root<br>
        3. Settings > Pages > Deploy from main / root<br>
        4. After deploy, open page, F12 console, run pushRegistryToFirebase()<br>
        5. Public now sees data from Firebase gi_registry collection
      </div>
    </div>
  `;
  const tbody = document.getElementById('tbody');
  data.forEach(item=>{
    const tr=document.createElement('tr');
    tr.style.borderTop='1px solid #eee';
    tr.innerHTML='<td style="padding:12px">'+(item.giNo||'')+'</td><td style="padding:12px;font-weight:500">'+(item.giName||'')+'</td><td style="padding:12px">'+(item.applicant||'')+'</td><td style="padding:12px">'+(item.registration||'')+'</td>';
    tbody.appendChild(tr);
  });
}
render();
</script>
</body>
</html>
